[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ripple-impact-mcp"
version = "1.1.0"
description = "Field-level semantic impact analysis for Claude Code — see the ripple effect of any code change"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "mcp-server", "code-analysis", "impact-analysis", "ast", "claude", "claude-code", "ripple", "semantic", "field-impact"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "anyio>=4.0.0,<5.0.0",
]

[project.scripts]
ripple-mcp = "field_impact_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/0xYubo/Ripple-Mcp"
Issues = "https://github.com/0xYubo/Ripple-Mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/field_impact_mcp"]
