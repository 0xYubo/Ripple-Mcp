[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "field-impact-mcp"
version = "0.1.0"
description = "MCP server for semantic field-level impact analysis across codebases"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "code-analysis", "impact-analysis", "ast", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
field-impact-mcp = "field_impact_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/ybmyb/field-impact-mcp"
Issues = "https://github.com/ybmyb/field-impact-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/field_impact_mcp"]
